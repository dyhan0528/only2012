function checkStreak(){
  const t=dayKey();
  if(!G.lastGoal||G.lastGoal===t) return;
  const gap=dayDiff(G.lastGoal,t); if(gap<=1) return;
  const missed=gap-1;
  if(G.streak>0&&G.freezes>=missed){
    G.freezes-=missed;
    for(let i=1;i<=missed;i++) G.frozen.push(addDays(G.lastGoal,i));
    G.lastGoal=addDays(t,-1);
    ev({k:"freeze",t:`보호권 ${missed}개가 연속 학습을 지켜 줬어`,s:`연속 ${G.streak}일 유지 중. 오늘 목표 채우면 이어져.`});

    ev({k:"lost",t:`연속 학습 ${G.streak}일이 끊겼어`,s:"괜찮아, 오늘부터 다시 1일. 보호권 사 두면 다음엔 지켜 줘."});

}
function addXP(n){

  Object.keys(G.days).forEach(k=>{if(dayDiff(k,t)>70) delete G.days[k]});
  G.frozen=G.frozen.filter(k=>dayDiff(k,t)<=70);
  if(G.days[t]>=G.goal&&G.lastGoal!==t){
    G.streak=(G.lastGoal&&dayDiff(G.lastGoal,t)===1)?G.streak+1:1;
    G.lastGoal=t; G.best=Math.max(G.best,G.streak);
    const bonus={3:10,7:30,14:50,30:100,50:150,100:300}[G.streak]||0;

}

/* 기록 코드: 기록 전체를 한 줄 문자열로. 끝 4글자는 오타 확인용 */
function sum4(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0;return h.toString(36).slice(-4).padStart(4,"0")}

  return "ONLY2012-"+body+"-"+sum4(body);
}
function decodeCode(code){
  const c=(code||"").replace(/\s+/g,"");
  const m=/^ONLY2012-([A-Za-z0-9+/=]+)-([0-9a-z]{4})$/.exec(c);
  if(!m) return {err:"기록 코드 모양이 아니야. ‘ONLY2012-’로 시작하는 코드를 통째로 붙여 넣어 줘."};
  if(sum4(m[1])!==m[2]) return {err:"코드 일부가 빠졌거나 바뀌었어. 처음부터 끝까지 다시 복사해 줘."};
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(!d||d.v!==1||typeof d.q!=="object"||typeof d.g!=="object") throw 0;
    return {d};
  }catch(e){return {err:"코드를 읽을 수 없어. 다시 복사해서 붙여 넣어 줘."}}
}

/* ---------- 한 문장 카드 (1분 루틴 · 기본 학습 방식) ---------- */
const SENTS=[];
QS.forEach(Q=>["main","twin"].forEach(v=>Q[v].forEach((p,i)=>SENTS.push(Object.assign({id:Q.id+(v==="main"?"m":"t")+i,q:Q.id,v,i},p)))));
const SBY=Object.fromEntries(SENTS.map(s=>[s.id,s]));
S.sc=S.sc||{};
const twinSent=s=>SBY[s.q+(s.v==="main"?"t":"m")+s.i]||null;
const fastLimit=s=>Math.min(2600,700+s.t.length*38);
let cs=null;
function unitSents(u){return SENTS.filter(s=>u.qs.includes(s.q))}
function cardStats(u){
  const pool=unitSents(u), seen=pool.filter(s=>S.sc[s.id]);
  return {total:pool.length,seen:seen.length,right:seen.filter(s=>S.sc[s.id].last===1).length,wrongNow:seen.filter(s=>S.sc[s.id].last===0).length};
}
function startCards(uid,onlyWrong){
  const u=UNITS[uid]; if(!u||unitLocked(u)) return;
  cu=u;
  const pool=unitSents(u), last=s=>(S.sc[s.id]||{}).last;
  let pick=onlyWrong?shuffle(pool.filter(s=>last(s)===0)).slice(0,10):[];
  if(!pick.length){
    const wrong=shuffle(pool.filter(s=>last(s)===0)).slice(0,4);
    const unseen=shuffle(pool.filter(s=>!S.sc[s.id]&&!wrong.includes(s)));
    const rest=shuffle(pool.filter(s=>!wrong.includes(s)&&!unseen.includes(s)));
    pick=shuffle([...wrong,...unseen,...rest].slice(0,10));
  }
  cs={u:uid,queue:pick.map(s=>s.id),i:0,phase:"ask",t0:Date.now(),res:[],twins:{},cur:{},events:[],xp:0,start:Date.now()};
  go("cardq"); cs.t0=Date.now();
}
const curSent=()=>SBY[cs.queue[cs.i]];
function cardAnswer(sayOk){
  if(!cs||cs.phase!=="ask") return;
  const s=curSent(), dt=Date.now()-cs.t0;
  cs.cur={choice:sayOk,dt};
  if(!s.ok&&!sayOk){cs.phase="tap";render();return}
  cardFinish(s.ok===sayOk,dt);
}
function cardTap(idx,tok){
  if(!cs||cs.phase!=="tap") return;
  const s=curSent(); cs.cur.tapIdx=idx; cs.cur.tapOk=s.w.includes(norm(tok));
  if(cs.cur.tapOk) bump("step");
  cardFinish(cs.cur.tapOk,cs.cur.dt);
}
function cardFinish(correct,dt){
  const s=curSent(), rec=S.sc[s.id]||{r:0,w:0};
  events=[];
  rec.last=correct?1:0; if(correct) rec.r++; else rec.w++;
  S.sc[s.id]=rec;
  cs.cur.correct=correct;
  if(correct){
    addXP(1); cs.xp+=1;
    if(s.ok&&s.trap) bump("trap");
    if(cs.twins[s.id]) bump("twin");
    const tw=twinSent(s);
    if(dt<fastLimit(s)&&tw&&!cs.twins[tw.id]&&!cs.queue.includes(tw.id)&&cs.queue.length<14){cs.queue.splice(cs.i+1,0,tw.id);cs.twins[tw.id]=true;cs.cur.fast=true}
  }else{
    addMiss(s.ok?s.trap:s.rule);
    const tw=twinSent(s);
    if(tw&&!cs.queue.includes(tw.id)&&cs.queue.length<14){cs.queue.push(tw.id);cs.twins[tw.id]=true;cs.cur.retry=true}
  }
  cs.res.push({id:s.id,correct});
  cs.events.push(...events); events=[];
  cs.phase="fb"; save(); beep(correct?"ok":"ng"); render();
}
function cardNext(){
  if(!cs||cs.phase!=="fb") return;
  speakStop(); cs.i++;
  if(cs.i>=cs.queue.length){
    events=[];
    const right=cs.res.filter(r=>r.correct).length, perfect=right===cs.res.length;
    const bonus=10+(perfect?5:0); addXP(bonus); cs.xp+=bonus;
    bump("session"); if(perfect) bump("perfect");
    cs.events.push(...events); events=[];
    cs.phase="done"; cs.sec=Math.round((Date.now()-cs.start)/1000); save(); beep("done"); render(); window.scrollTo(0,0); return;
  }
  cs.phase="ask"; cs.cur={}; render(); cs.t0=Date.now();
}
function tokensHtml(s,mode){
  return `<div class="cq-tokens">${s.t.split(" ").map((t,k)=>{
    let cls=""; if(mode==="fb"&&!s.ok){ if(s.w.includes(norm(t))) cls="hit"; else if(cs.cur.tapIdx===k) cls="miss"; }
    return mode==="tap"?`<button class="cq-tok" data-ctok="${esc(t)}" data-cidx="${k}">${esc(t)}</button>`:`<span class="cq-word ${cls}">${esc(t)}</span>`;}).join(" ")}</div>`;
}
function renderCardQ(){
  if(!cs){go("home");return}
  if(cs.phase==="done") return renderCardDone();
  const s=curSent(), N=cs.queue.length, u=UNITS[cs.u], c=cs.cur;
  const segs=cs.queue.map((id,k)=>`<i class="${k<cs.i?(cs.res[k]&&cs.res[k].correct?"ok":"ng"):k===cs.i?"cur":""}"></i>`).join("");
  let panel="";
  if(cs.phase==="ask") panel=`<div class="cq-ox"><button class="cq-x" id="cqX">X<small>틀린 문장</small><kbd>←</kbd></button><button class="cq-o" id="cqO">O<small>맞는 문장</small><kbd>→</kbd></button></div>`;
  else if(cs.phase==="tap") panel=`<p class="cq-hint">${ic("target","sm")}맞아, 틀린 문장! 어디가 틀렸어? 틀린 단어를 눌러 봐.</p>`;
  else{
    const good=c.correct, R=RULES[s.ok?s.trap:s.rule];
    const head=good?(s.ok?"맞아! 맞는 문장":`${c.tapOk?"정확히 짚었어!":"맞아"}`):(s.ok?"아깝다! 이건 맞는 문장이야":c.choice?"아깝다! 틀린 문장이야":"틀린 문장인 건 맞혔는데, 틀린 곳이 달라");
    panel=`<section class="cq-fb ${good?"good":"bad"}" role="status">
      <b class="cq-fbh">${ic(good?"check":"x")}${head}</b>
      ${s.ok?"":`<p class="cq-fix">${fixHtml(s.fix)}</p>`}
      <p>${esc(s.ex)}</p>
      ${R?`<span class="rtag">${s.ok?"함정 · ":""}${s.ok?s.trap:s.rule} · ${esc(R.name)}</span>`:""}
      ${c.fast?`<p class="cq-note">${ic("alert","sm")}빨랐는데… 찍은 거 아니지? 쌍둥이 문장 하나 더 간다.</p>`:""}

function hashFor(){
  if(view==="unit") return "unit-"+cu.id;
  if(view==="cardq") return "unit-"+cu.id+".s";
  if(view==="quiz") return "unit-"+cu.id+".q";
  if(view==="cards") return "unit-"+cu.id+".c";
  return view;
}
function pushHash(){try{const h=hashFor(); if(location.hash.slice(1)!==h) history.pushState(null,"","#"+h)}catch(e){}}
function routeHash(){
  let h="";try{h=(location.hash||"").slice(1)}catch(e){}
  const [base,sub]=h.split(".");
  if(base==="book"||base==="topic"||base==="me"){view=base==="topic"?"book":base;return}
  if(base&&base.startsWith("unit-")){
    const u=UNITS[base.slice(5)];
    if(u&&!unitLocked(u)){
      cu=u;
      if(sub==="q"&&run&&unitOf(run.id)===u){view="quiz";return}
      if(sub==="s"&&cs&&cs.u===u.id){view="cardq";return}
      if(sub==="c"&&deck&&deck.keys.every(k=>u.cards.includes(k))){view="cards";return}
      view="unit";return;
    }
  }
  view="home";
}
window.addEventListener("popstate",()=>{routeHash();render();window.scrollTo(0,0)});
function go(v){view=v;pushHash();render();window.scrollTo(0,0);const m=document.getElementById("main");if(m)m.focus({preventScroll:true})}

function donut(ids,label){
  const c=counts(ids), N=ids.length, C=2*Math.PI*48; let acc=0;
  const arcs=[["done","var(--ok)"],["lucky","var(--warn-fill)"],["review","var(--err)"]].map(([k,col])=>{const len=c[k]/N*C;const s=`<circle cx="60" cy="60" r="48" fill="none" stroke="${col}" stroke-width="12" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"/>`;acc+=len;return c[k]?s:""}).join("");
  return `<div class="donut"><svg viewBox="0 0 120 120" role="img" aria-label="${label} 이해 완료 ${c.done}/${N}"><circle cx="60" cy="60" r="48" fill="none" stroke="var(--border)" stroke-width="12"/>${arcs}<text x="60" y="58" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text)" font-family="Noto Sans KR, sans-serif">${c.done}</text><text x="60" y="78" text-anchor="middle" font-size="11.5" fill="var(--text-3)" font-family="Noto Sans KR, sans-serif">/ ${N} 완료</text></svg>

}

  const badge=(n,done)=>stage===n?`<span class="badge now">지금 할 차례</span>`:(done?`<span class="badge ok">${ic("check","sm")}완료</span>`:"");
  const tile=id=>{const q=QS[id-1],s=status(id);return `<button class="tile ${s}" data-q="${id}"><b>${id}</b><small>${TYPE_CHIP[q.type]}</small><span class="st">${ic(stIcon[s],"sm")}${STLABEL[s]}</span></button>`};
  page(`
  <nav class="crumb"><button data-nav="home">홈</button>${ic("chev","sm")}<span>${esc(u.where)}</span>${ic("chev","sm")}<b>${esc(u.name)}</b></nav>

    <div><span class="chip">${esc(TAGNAME[u.tag])}</span><h1>${esc(u.full)}</h1></div>
    <div class="callout">${ic("flame")}<p><b>이거 반드시 나온다.</b> ${esc(u.hook)}</p></div>
  </section>
  <div class="layout">
    <div class="stack">
      <div class="path">
        <div class="card pstep ${stage===1?"now":""}"><div class="ph"><span class="num">STEP 1</span>${badge(1,cd===u.cards.length)}</div>
          <h3>규칙 카드 ${u.cards.length}장</h3><p>공식 먼저 보고, 뒤집어서 예문 확인. 이유 말할 수 있으면 체크!</p>
          <div class="pbar"><i style="width:${cd/u.cards.length*100}%"></i></div><div class="pmeta"><span>이해 완료 ${cd} / ${u.cards.length}</span></div>
          <button class="btn ${stage===1?"primary":""}" id="p1">${cd===0?"카드 시작":cd<u.cards.length?"이어서 보기":"다시 보기"}</button></div>
        <div class="card pstep ${stage===2?"now":""}"><div class="ph"><span class="num">STEP 2</span>${badge(2,c.todo===0)}</div>
          <h3>1분 루틴 · 문장 카드 10장</h3><p>문장 하나씩 O/X. 틀린 문장이면 틀린 단어 한 번 짚기. 끝.</p>
          <div class="pbar"><i style="width:${cst.seen?cst.right/cst.total*100:0}%"></i></div><div class="pmeta"><span>맞힌 문장 ${cst.right} / ${cst.total}</span><span>틀린 채 남음 ${cst.wrongNow}</span></div>
          <button class="btn ${stage===2?"primary":""}" id="p2">${cst.seen?"1분 루틴 한 번 더":"1분 루틴 시작"}</button></div>
        <div class="card pstep ${stage===3?"now":""}"><div class="ph"><span class="num">STEP 3</span>${badge(3,solved>0&&rv===0)}</div>
          <h3>쌍둥이 복습</h3><p>틀리거나 찍어서 맞힌 건 같은 함정, 새 문장으로 다시. 이게 진짜 확인.</p>
          <div class="pbar"><i style="width:${solved?((solved-rv)/solved*100):0}%;background:var(--ok)"></i></div><div class="pmeta"><span>복습할 문항 ${rv}</span></div>
          <button class="btn ${stage===3?"primary":""}" id="p3" ${rv?"":"disabled"}>${rv?"복습 시작":"복습할 거 없음"}</button></div>
      </div>
      <section class="sec"><div class="sech"><h2>실전 모드 · 5지선다 ${N}문항</h2><span class="note">시험 직전 점검용. 판정 → 짚기 → 이유 → 고쳐 쓰기까지 전부.</span></div><div class="tiles">${u.qs.map(tile).join("")}</div></section>
    </div>
    <aside class="aside">
      <section class="card panel"><h2>이 단원 내 기록</h2>${donut(u.qs,u.name)}</section>
      <section class="card panel"><h2>이 단원 규칙 카드</h2><div class="rmini">${u.cards.map((k,n)=>`<button class="ritem" data-rc="${n}"><span class="rid">${k}</span><span>${esc(RULES[k].name)}</span><span class="ck">${S.cards[k]?ic("check"):""}</span></button>`).join("")}</div></section>

function qbar(){
  const ph=run.phase, n=ph==="judge"?1:ph==="judged"?2:3;
  const sp=(k,t)=>`<span class="sp ${k===n?"on":k<n?"ok":""}"><i>${k<n?ic("check"):k}</i>${t}</span>`;
  const prog=cu.qs.map(id=>`<i class="${status(id)} ${id===run.id?"cur":""}"></i>`).join("");
  return `<div class="qbar"><button class="back" id="back">${ic("left")}${esc(cu.name)}</button>
    <div class="stepper">${sp(1,"O/X 판정")}<span class="sep"></span>${sp(2,"짚기")}<span class="sep"></span>${sp(3,"결과")}</div>
    <div class="qprog">${prog}<span>${cu.qs.indexOf(run.id)+1} / ${cu.qs.length}</span></div></div>`;
}
function qhead(){
  const {Q,variant}=run;
  return `<div class="qhead"><div class="chips"><span class="chip">${esc(cu.name)}</span><span class="chip">${TYPE_CHIP[Q.type]}</span>${variant==="twin"?`<span class="chip twin">쌍둥이 문항</span>`:""}</div>
    <p class="stem">${Q.id}. ${esc(Q.stem||STEM[Q.type])}</p></div>`;
}
function bindBack(){document.getElementById("back").onclick=()=>go("unit")}
function renderQuiz(){
  const {Q,opts,judge,phase}=run, L=labels(Q);
  const cur=phase==="judged"?run.steps[run.si]:null;
  const rows=opts.map((p,i)=>{
    let right, cls="";
    if(phase==="judge"){
      cls="pickable"+(run.row===i?" sel":"");
      right=`<div class="ox"><button class="o ${judge[i]===true?"on":""}" data-j="${i}" data-v="1" aria-pressed="${judge[i]===true}" aria-label="${L[i]} 맞음">O</button><button class="x ${judge[i]===false?"on":""}" data-j="${i}" data-v="0" aria-pressed="${judge[i]===false}" aria-label="${L[i]} 틀림">X</button></div>`;
    }else{
      cls=cur.i===i?"sel":"dim";
      const good=run.judgeRes[i];
      right=`<span class="verdict ${good?"good":"bad"}">${good?ic("check"):ic("x")}내 판정 ${judge[i]?"O":"X"} · ${good?"맞음":"틀림"}</span>`;
    }
    return `<div class="opt ${cls}" data-row="${i}"><span class="lab">${L[i]}</span><span class="sent">${esc(p.t)}</span>${right}</div>`;
  }).join("");
  page(`${qbar()}
    <div class="layout q">
      <section class="qmain">${qhead()}<div class="opts">${rows}</div></section>
      <aside class="aside">${phase==="judge"?coachJudge():coachStep()}</aside>
    </div>`);
  bindBack();
  app.querySelectorAll("[data-row]").forEach(r=>r.onclick=()=>{if(run.phase==="judge"){run.row=+r.dataset.row;render()}});
  app.querySelectorAll("[data-j]").forEach(b=>b.onclick=e=>{e.stopPropagation();setJudge(+b.dataset.j,b.dataset.v==="1")});
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{run.conf=b.dataset.c;render()});
  const sb=document.getElementById("submit"); if(sb) sb.onclick=submitJudge;
  app.querySelectorAll("[data-tok]").forEach(b=>b.onclick=()=>answerStep({tok:b.dataset.tok,idx:+b.dataset.idx}));
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>answerStep(b.dataset.pick));
  const nx=document.getElementById("next"); if(nx) nx.onclick=nextStep;
}
function coachJudge(){
  const n=run.judge.filter(v=>v!==null).length, N=run.opts.length, all=n===N;
  return `<section class="card coach">
    <span class="label">1단계 · O/X 판정</span>
    <h2>문장 하나하나 O / X 해 봐</h2>
    <p class="note">번호 찍기 금지. 감 말고 근거로. 다섯 문장 다 판정해야 넘어갈 수 있어.</p>
    <div class="meter"><div class="top"><span>판정한 문장</span><b>${n} / ${N}</b></div><div class="pbar"><i style="width:${n/N*100}%"></i></div></div>
    <div class="field"><span class="flabel">솔직하게, 얼마나 확신해?</span><div class="seg">${[["sure","확실"],["unsure","애매"],["guess","찍음"]].map(([k,t])=>`<button data-c="${k}" class="${run.conf===k?"on":""}" aria-pressed="${run.conf===k}">${t}</button>`).join("")}</div>
    <p class="note">‘찍음’으로 맞히면 쌍둥이 문항으로 한 번 더 확인해. 솔직할수록 이득임.</p></div>
    <button class="btn primary wide" id="submit" ${canSubmit()?"":"disabled"}>판정 제출 <kbd>Enter</kbd></button>
    <p class="note">${!all?"아직 판정 안 한 문장이 있어.":(!run.conf?"확신 정도만 고르면 끝.":"좋아. 제출하면 틀린 곳 하나씩 같이 짚어 보자.")}</p>
    <div class="divider"></div>
    <div class="keyhint"><span><kbd>↑</kbd><kbd>↓</kbd> 문장 이동</span><span><kbd>O</kbd><kbd>X</kbd> 판정</span></div>
  </section>`;
}
function coachStep(){
  const st=run.steps[run.si], p=run.opts[st.i], L=labels(run.Q), lab=L[st.i];
  const answered=st.ok!==undefined;
  const pips=run.steps.map((s,k)=>`<i class="${k<run.si?(s.ok?"ok":"ng"):(k===run.si?(answered?(s.ok?"ok":"ng"):"cur"):"")}"></i>`).join("");
  const nOk=run.judgeRes.filter(Boolean).length;
  const misjudged=!run.judgeRes[st.i];
  const kindName={tap:"틀린 곳 짚기",reason:"이유 고르기",fix:"고쳐 쓰기",why:"함정 근거 확인"}[st.kind];
  let prompt="",body="",fb="";
  if(st.kind==="tap"){
    prompt=`${lab} 문장에서 틀린 단어를 클릭해 봐.`;
    body=`<div class="tokens">${p.t.split(" ").map((t,k)=>{
      let cls=""; if(answered){ if(p.w.includes(norm(t))) cls="hit"; else if(st.picked.idx===k) cls="miss"; }
      return `<button class="tok ${cls}" data-tok="${esc(t)}" data-idx="${k}" ${answered?"disabled":""}>${esc(t)}</button>`}).join("")}</div>`;
    if(answered) fb=feedback(st,`틀린 곳: <b>${esc(p.fix.split(" → ")[0])}</b>`,"노란색이 문제 부분. 다음 단계에서 왜 틀렸는지 골라 보자.");
  }else if(st.kind==="reason"||st.kind==="why"){
    const correct=st.kind==="reason"?p.rule:p.trap;
    prompt=st.kind==="reason"?`${lab}는 왜 틀렸을까? 규칙 골라 봐.`:`<span class="tag">함정 문장</span><br>${lab}는 틀려 보이는데 사실 맞는 문장이야. 근거가 되는 규칙은?`;
    body=`<div class="big">${esc(p.t)}</div><div class="choices">${st.choices.map((r,n)=>{
      let cls=""; if(answered){ if(r===correct) cls="right"; else if(r===st.picked) cls="wrong"; }
      return `<button class="choice ${cls}" data-pick="${r}" ${answered?"disabled":""}><kbd>${n+1}</kbd><span class="rid">${r}</span><span>${esc(RULES[r].name)}</span></button>`}).join("")}</div>`;
    if(answered) fb=feedback(st,`${correct} · ${esc(RULES[correct].name)}`,RULES[correct].body+(st.kind==="why"?" "+p.ex:""),RULES[correct].eg);
  }else{
    prompt=`${lab}는 어떻게 고쳐야 해?`;
    body=`<div class="big">${esc(p.t)}</div><div class="choices">${st.choices.map((c,n)=>{
      let cls=""; if(answered){ if(c===p.fix) cls="right"; else if(c===st.picked) cls="wrong"; }
      return `<button class="choice fixc ${cls}" data-pick="${esc(c)}" ${answered?"disabled":""}><kbd>${n+1}</kbd><span>${esc(c)}</span></button>`}).join("")}</div>`;
    if(answered) fb=feedback(st,esc(p.fix),p.ex);
  }
  const last=run.si+1>=run.steps.length;
  return `<section class="card coach">
    <div class="stepnav"><span class="label">2단계 · ${kindName} · ${run.si+1} / ${run.steps.length}</span><div class="pips">${pips}</div></div>
    <div class="fb ${run.judgeOk?"good":"bad"}"><b class="h">${ic(run.judgeOk?"check":"alert","sm")}O/X 판정 ${nOk} / ${run.opts.length} 맞음</b><span>네 판정대로면 답은 <b>${esc(studentAnswer(run.Q,run.judge))}</b>${run.judgeOk?" · 판정 완벽! 이제 이유까지 확인하자.":` · 진짜 정답은 <b>${esc(answerText(run.Q,run.opts))}</b>`}</span></div>
    ${misjudged&&(st.kind==="tap"||st.kind==="why")?`<p class="note">${lab}를 ${run.judge[st.i]?"O":"X"}로 봤는데, 사실 ${p.ok?"맞는":"틀린"} 문장이야.</p>`:""}
    <p class="prompt">${prompt}</p>
    ${body}
    ${fb}
    ${answered?`<button class="btn primary wide" id="next">${last?"결과 보기":"다음 단계"} <kbd>Enter</kbd></button>`:`<div class="keyhint">${st.kind==="tap"?"문장 속 단어를 클릭해.":"<span><kbd>1</kbd>–<kbd>4</kbd> 보기 선택</span>"}</div>`}
  </section>`;
}
function feedback(st,head,text,eg){
  const ok=st.ok;
  return `<div class="fb ${ok?"good":"bad"}"><b class="h">${ic(ok?"check":"x","sm")}${ok?esc(st.line)+" · ":"아깝다! 정답은 "}${head}</b><span>${esc(text)}</span>${eg?`<span class="eg">${esc(eg)}</span>`:""}</div>`;
}

/* ---------- 결과 ---------- */
function renderDone(){
  const {Q,opts,judge,variant,result,id}=run, L=labels(Q);
  const rec=S.q[id]||{};
  const lucky=variant==="main"&&result==="pass"&&rec.lucky;
  const cls=lucky?"partial":result;
  const title=lucky?"맞긴 했는데… 찍었다며?":{pass:"이해 완료! 이제 이건 네 거",partial:"답은 맞았는데 이유가 아직",fail:"복습 필요. 지금 틀려서 다행"}[result];
  const desc=lucky?"찍어서 맞힌 건 시험에서 또 맞힌다는 보장 없음. 쌍둥이 문항으로 확인 ㄱㄱ"
    :result==="pass"?(variant==="twin"?"쌍둥이까지 통과. 이 함정은 이제 너한테 안 통한다.":"O/X 판정, 틀린 곳, 이유, 고쳐 쓰기 전부 한 번에. 이게 진짜 실력.")
    :result==="partial"?"번호만 맞은 건 반은 운이야. 같은 함정의 쌍둥이 문항으로 진짜 아는지 확인하자."
    :"시험 전에 틀린 거면 이득임. 왼쪽 해설 보고 쌍둥이 문항으로 다시 가자.";
  const stepOk=run.steps.filter(s=>s.ok).length;
  const nid=nextIn(cu,id);
  let primary="";
  if(variant==="main"&&(result!=="pass"||lucky)) primary=`<button class="btn primary wide" id="primary" data-act="twin">쌍둥이 문항으로 확인 <kbd>Enter</kbd></button>`;
  else if(variant==="twin"&&result!=="pass") primary=`<button class="btn primary wide" id="primary" data-act="retry">원래 문항 다시 풀기 <kbd>Enter</kbd></button>`;
  else if(nid) primary=`<button class="btn primary wide" id="primary" data-act="next">${nid}번 문항으로 <kbd>Enter</kbd></button>`;
  else primary=`<button class="btn primary wide" id="primary" data-act="unit">단원 끝! 단원 화면으로 <kbd>Enter</kbd></button>`;
  const rows=opts.map((p,i)=>`<div class="card sumrow">
    <span class="mark ${p.ok?"o":"x"}">${p.ok?"O":"X"}</span><span class="lab">${L[i]}</span><span class="sent">${esc(p.t)}</span>
    <div class="detail">
      ${p.ok?"":`<span class="fixline">${fixHtml(p.fix)}</span>`}
      <span class="ex">${esc(p.ex)}</span>
      ${(p.rule||p.trap)?`<span class="rtag">${p.rule||p.trap} · ${esc(RULES[p.rule||p.trap].name)}${p.trap?" · 함정":""}</span>`:""}
    </div></div>`).join("");
  page(`${qbar()}
    <div class="layout q">
      <section class="qmain">${qhead()}<div class="review"><h2>문장별 해설 · 이거 다 시험에 나오는 포인트</h2>${rows}</div></section>
      <aside class="aside"><section class="card rcard ${cls}">
        <span class="icon">${ic(cls==="pass"?"check":cls==="partial"?"alert":"x")}</span>
        <h2>${title}</h2><p>${desc}</p>
        <div class="scores">
          <div><small>O/X 판정</small><b>${run.judgeRes.filter(Boolean).length} / ${opts.length}</b></div>
          <div><small>짚기 단계</small><b>${stepOk} / ${run.steps.length}</b></div>
          <div><small>정답</small><b class="ans">${esc(answerText(Q,opts))}</b></div>
          <div><small>내 답</small><b class="ans">${esc(studentAnswer(Q,judge))}</b></div>
        </div>
        <div class="rew" aria-label="이번 문제 보상">
          <div class="xpgain">${ic("bolt")}<b>+${run.xp} XP</b><span>${run.variant==="twin"?"쌍둥이":"문제"} 완료${run.result==="pass"?" · 이해 완료 보너스":""}</span></div>
          <div class="goalbar"><span>오늘 목표</span><div class="pbar"><i style="width:${Math.min(100,(G.days[dayKey()]||0)/G.goal*100)}%"></i></div><small>${Math.min(G.days[dayKey()]||0,G.goal)} / ${G.goal}</small></div>
          ${(run.events||[]).map(e=>`<div class="revt ${e.k}">${ic(EVICON[e.k]||"star")}<div><b>${esc(e.t)}</b><span>${esc(e.s||"")}</span></div></div>`).join("")}
        </div>
        ${primary}
        <button class="btn wide" id="tounit">단원 화면으로</button>
      </section></aside>
    </div>`);
  bindBack();
  document.getElementById("tounit").onclick=()=>go("unit");
  const pb=document.getElementById("primary");
  pb.onclick=()=>{const a=pb.dataset.act; if(a==="twin") startQ(id,"twin"); else if(a==="retry") startQ(id,"main"); else if(a==="next") startQ(nid,"main"); else go("unit")};
}
function fixHtml(f){const [a,b]=f.split(" → ");return `<del>${esc(a)}</del> → <ins>${esc(b)}</ins>`}

/* ---------- 규칙 카드 ---------- */
const hi=(s,c)=>esc(s).replace(/\[(.+?)\]/g,`<mark class="${c}">$1</mark>`);
function renderCards(){
  const keys=deck.keys, k=keys[deck.i], r=RULES[k], c=CARDS[k], done=!!S.cards[k], last=deck.i===keys.length-1;
  const formula=c.f.map(parts=>`<div class="formula">${parts.map((p,n)=>`${n?'<span class="plus">+</span>':""}<span class="blk ${n===parts.length-1?"slot":""}">${esc(p)}</span>`).join("")}</div>`).join("");
  const item=(kk,n)=>`<button class="ritem ${n===deck.i?"on":""}" data-card="${n}"><span class="rid">${kk}</span><span>${esc(RULES[kk].name)}</span><span class="ck">${S.cards[kk]?ic("check"):""}</span></button>`;
  const GN={1:"지각동사",2:"so ~ that",3:"목적격 관계대명사",4:"used to"}; const groups=[...new Set(keys.map(kk=>RULES[kk].g))];
  const list=`<nav class="card rlist" aria-label="규칙 목록">${groups.map(g=>`<span class="gl">${GN[g]||""}</span>${keys.map((kk,n)=>RULES[kk].g===g?item(kk,n):"").join("")}`).join("")}</nav>`;
  page(`
  <nav class="crumb"><button data-nav="home">홈</button>${ic("chev","sm")}<button id="crumbUnit">${esc(cu.name)}</button>${ic("chev","sm")}<b>규칙 카드</b></nav>
  <div class="layout c">
    <aside class="aside">${list}</aside>
    <section class="stage">
      <div class="cardtop"><span>규칙 카드 <b>${deck.i+1} / ${keys.length}</b> · 이해 완료 <b>${cardsDoneIn(keys)}</b></span><div class="pips">${keys.map((kk,n)=>`<i class="${S.cards[kk]?"ok":""} ${n===deck.i?"cur":""}"></i>`).join("")}</div></div>
      <button class="fcard ${deck.flipped?"flipped":""}" id="flip" aria-label="카드 뒤집기">
        <div class="face front" aria-hidden="${deck.flipped}">
          <div class="fhead"><span class="fid">${k}</span><span class="fgroup">${({1:"지각동사",2:"so ~ that",3:"목적격 관계대명사",4:"used to"})[r.g]||""} · 이거 반드시 나옴</span></div>
          <h2 class="ftitle">${esc(r.name)}</h2>
          <div class="formulas">${formula}</div>
          <span class="hint">클릭하거나 <kbd>Space</kbd> 눌러서 예문 보기 ${ic("flip","sm")}</span>
        </div>
        <div class="face back" aria-hidden="${!deck.flipped}">
          <div class="fhead"><span class="fid">${k}</span><span class="fgroup">${esc(r.name)}</span></div>
          <p class="fkey">${esc(c.key)}</p>
          <div class="fex good"><span class="mk">O</span><span class="es">${hi(c.good,"g")}</span></div>
          <div class="fex bad"><span class="mk">X</span><span class="es">${hi(c.bad,"b")}</span></div>
          <p class="fwhy">${esc(c.why)}</p>
          <span class="hint"><kbd>Space</kbd> 공식 다시 보기 ${ic("flip","sm")}</span>
        </div>
      </button>
      <label class="check ${deck.seen?"":"off"}" for="cardok">
        <input type="checkbox" id="cardok" ${done?"checked":""} ${deck.seen?"":"disabled"}>
        <span class="box" aria-hidden="true">${ic("check")}</span>
        <span>${deck.seen?"이해 완료: 왜 O고 왜 X인지 친구한테 설명할 수 있음":"카드 뒤집어서 예문 봐야 체크할 수 있어"}</span>
        ${deck.seen?"<kbd>Enter</kbd>":""}
      </label>
      <div class="deckbtns">
        <button class="btn" id="prev" ${deck.i===0?"disabled":""}>${ic("left")}이전 카드</button>
        <button class="btn primary" id="nextc" ${done?"":"disabled"}>${last?"카드 끝! 단원으로":"다음 카드"} ${ic("right")}</button>
      </div>
    </section></div>`);
  document.getElementById("crumbUnit").onclick=()=>go("unit");
  app.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>openDeck(keys,+b.dataset.card));
  document.getElementById("flip").onclick=flipCard;
  document.getElementById("cardok").onchange=e=>setCard(e.target.checked);
  document.getElementById("prev").onclick=()=>openDeck(keys,deck.i-1);
  document.getElementById("nextc").onclick=nextCard;
}
function flipCard(){deck.flipped=!deck.flipped;if(deck.flipped)deck.seen=true;render()}
function setCard(v){const k=deck.keys[deck.i];if(v)S.cards[k]=true;else delete S.cards[k];if(v&&!G.cardXp[k]){G.cardXp[k]=1;events=[];addXP(2);bump("card");ev({k:"xp",t:"규칙 카드 체크 +2 XP",s:`오늘 ${G.days[dayKey()]||0} / ${G.goal} XP`})}save();render();flushToasts()}
function nextCard(){if(!S.cards[deck.keys[deck.i]])return; if(deck.i===deck.keys.length-1) go("unit"); else openDeck(deck.keys,deck.i+1)}

/* ---------- 키보드 ---------- */
document.addEventListener("keydown",e=>{
  if(document.getElementById("onb")) return;
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat) return;
  const code=e.code, digit=/^(Digit|Numpad)([1-9])$/.exec(code), n=digit?+digit[2]:0;
  const act=f=>{e.preventDefault();f()};
  if(view==="cardq"&&cs){
    if(code==="KeyM"){act(toggleMute);return}
    if(code==="KeyS"&&cs.phase!=="done"){act(cs.phase==="fb"?sayCompare:sayCard);return}
    if(cs.phase==="ask"){ if(code==="KeyO"||code==="ArrowRight") act(()=>cardAnswer(true)); else if(code==="KeyX"||code==="ArrowLeft") act(()=>cardAnswer(false)); }
    else if(cs.phase==="fb"&&(code==="Enter"||code==="Space")) act(cardNext);
    else if(cs.phase==="done"&&code==="Enter") act(()=>startCards(cs.u));
    return;
  }
  if(view==="cards"){
    if(code==="Space") act(flipCard);
    else if(code==="Enter"&&deck.seen) act(()=>setCard(!S.cards[deck.keys[deck.i]]));
    else if(code==="ArrowRight") act(nextCard);
    else if(code==="ArrowLeft"&&deck.i>0) act(()=>openDeck(deck.keys,deck.i-1));
    return;
  }
  if(view!=="quiz"||!run) return;
  if(run.phase==="judge"){
    if(code==="ArrowDown") act(()=>{run.row=Math.min(run.opts.length-1,run.row+1);render()});
    else if(code==="ArrowUp") act(()=>{run.row=Math.max(0,run.row-1);render()});
    else if(code==="KeyO"||code==="KeyX") act(()=>setJudge(run.row,code==="KeyO"));
    else if(n&&n<=run.opts.length) act(()=>{run.row=n-1;render()});
    else if(code==="Enter"&&canSubmit()) act(submitJudge);
  }else if(run.phase==="judged"){
    const st=run.steps[run.si];
    if(st.ok!==undefined){ if(code==="Enter") act(nextStep); }
    else if(st.kind!=="tap"&&n&&st.choices[n-1]) act(()=>answerStep(st.choices[n-1]));
  }else if(run.phase==="done"&&code==="Enter"){
    const b=document.getElementById("primary"); if(b) act(()=>b.click());
  }
});

function render(){
  if(view==="book") renderBook();
  else if(view==="topic") renderBook();
  else if(view==="unit") renderUnit();
  else if(view==="cards") renderCards();
  else if(view==="me") renderMe();
  else if(view==="cardq") renderCardQ();
  else if(view==="quiz"&&run) (run.phase==="done"?renderDone:renderQuiz)();
  else renderHome();
}
routeHash();
checkStreak();todayQuests();checkAch();save();
render();
flushToasts();
if(!G.onboarded&&!G.nick) openOnboard();
